[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batplot"
version = "1.8.46"
description = "Interactive plotting tool for material science (1D plot) and electrochemistry (GC, CV, dQ/dV, CPC, operando) with batch processing"
authors = [
    { name = "Tian Dai", email = "tianda@uio.no" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "rich>=10.0.0",
    "openpyxl>=3.0.0",
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "basedpyright>=1.28.0"]

[tool.basedpyright]
include = ["batplot", "tests"]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportPrivateUsage = "none"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportMissingTypeArgument = "none"
reportPossiblyUnboundVariable = "none"
reportIndexIssue = "none"
reportConstantRedefinition = "none"
exclude = ["archive_unused", "dist", "**/__pycache__", "*.egg-info"]

[project.urls]
Homepage = "https://github.com/chem-plot/batplot"
Repository = "https://github.com/chem-plot/batplot"
Issues = "https://github.com/chem-plot/batplot/issues"

[project.scripts]
batplot = "batplot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["batplot*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"batplot" = ["data/CHANGELOG.md", "data/latest_release_notes.json"]
