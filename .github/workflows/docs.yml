name: docs

# Build and publish the MkDocs user manual to GitHub Pages.
# Isolated from the batplot package tests / PyPI release path.

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material

      - name: Stamp last-published time on the home page
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          stamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          sha = (os.environ.get("GITHUB_SHA") or "")[:7] or "local"
          line = f"**Last published:** {stamp} (commit `{sha}`)"
          path = Path("docs/index.md")
          text = path.read_text(encoding="utf-8")
          new, n = re.subn(
              r"^\*\*Last published:\*\*.*$",
              line,
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit("Could not find '**Last published:**' line in docs/index.md")
          path.write_text(new, encoding="utf-8")
          print(line)
          PY

      - name: Build site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
